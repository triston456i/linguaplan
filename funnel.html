<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinguaPlan — Your Personal English Plan</title>
<style>
  :root{
    --navy:#0d1b3e;
    --navy-deep:#091430;
    --blue:#2e5bff;
    --blue-dark:#1f47e6;
    --blue-soft:#d9e3ff;
    --blue-faint:#eef2ff;
    --ink:#101828;
    --muted:#5b6478;
    --card:#ffffff;
    --line:#e6e9f2;
    --radius:24px;
    --maxw:520px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--navy);
    color:var(--ink);
    line-height:1.5;
  }
  .shell{max-width:var(--maxw);margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;color:#fff;
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:.2px}
  .brand-dot{width:26px;height:26px;border-radius:8px;background:var(--blue);display:grid;place-items:center;font-size:14px}
  .lang-btn{
    background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);
    border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .lang-btn:hover{background:rgba(255,255,255,.2)}

  /* ---------- generic ---------- */
  .screen{display:none;flex:1;flex-direction:column}
  .screen.active{display:flex}
  .btn{
    display:block;width:100%;border:0;cursor:pointer;
    background:var(--blue);color:#fff;font-weight:700;font-size:17px;
    padding:17px 24px;border-radius:999px;text-align:center;
    transition:background .15s ease, transform .1s ease;
  }
  .btn:hover{background:var(--blue-dark)}
  .btn:active{transform:scale(.985)}
  .btn:focus-visible,.opt:focus-visible,.plan:focus-visible,.lang-btn:focus-visible{
    outline:3px solid #9db4ff;outline-offset:2px;
  }
  .card{
    background:var(--card);border-radius:var(--radius);
    padding:26px 22px;box-shadow:0 10px 30px rgba(4,10,30,.25);
  }
  .card + .card{margin-top:18px}
  .card h2{font-size:21px;font-weight:800;margin-bottom:18px;text-wrap:balance}

  /* ---------- hero ---------- */
  #hero{padding:24px 20px 40px;color:#fff}
  .hero-inner{margin:auto 0;text-align:center;padding-top:6vh}
  .hero-eyebrow{
    display:inline-block;background:rgba(46,91,255,.25);border:1px solid rgba(120,150,255,.4);
    color:#c9d6ff;font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    padding:6px 14px;border-radius:999px;margin-bottom:22px;
  }
  .hero-inner h1{font-size:34px;line-height:1.15;font-weight:800;text-wrap:balance;margin-bottom:14px}
  .hero-inner h1 em{font-style:normal;color:#7d9bff}
  .hero-sub{color:#aab6d6;font-size:16.5px;max-width:34ch;margin:0 auto 30px}
  .hero-stats{display:flex;justify-content:center;gap:28px;margin-top:34px;color:#aab6d6;font-size:13px}
  .hero-stats b{display:block;color:#fff;font-size:20px;font-variant-numeric:tabular-nums}

  /* ---------- quiz ---------- */
  #quiz{padding:8px 20px 32px}
  .quiz-track{height:6px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-bottom:8px}
  .quiz-fill{height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .3s ease}
  .quiz-step{color:#8fa0c9;font-size:13px;font-weight:600;margin-bottom:22px}
  .quiz-q{color:#fff;font-size:25px;font-weight:800;line-height:1.25;text-wrap:balance;margin-bottom:24px}
  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
    background:var(--card);border:2px solid transparent;border-radius:18px;
    padding:16px 18px;font-size:16.5px;font-weight:600;color:var(--ink);
    transition:border-color .12s ease, transform .1s ease;
  }
  .opt:hover{border-color:var(--blue)}
  .opt:active{transform:scale(.985)}
  .opt .ico{
    width:44px;height:44px;border-radius:12px;background:var(--blue-faint);
    display:grid;place-items:center;font-size:22px;flex:none;
  }
  .quiz-back{
    margin-top:22px;background:none;border:0;color:#8fa0c9;font-size:14px;
    font-weight:600;cursor:pointer;padding:8px;align-self:center;
  }
  .quiz-back:hover{color:#fff}

  /* ---------- loading ---------- */
  #loading{align-items:center;justify-content:center;padding:40px 24px;color:#fff;text-align:center}
  .ring{
    width:74px;height:74px;border-radius:50%;margin-bottom:28px;
    border:6px solid rgba(255,255,255,.15);border-top-color:var(--blue);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading h2{font-size:23px;font-weight:800;margin-bottom:10px}
  #load-step{color:#aab6d6;font-size:15.5px;min-height:1.5em}

  /* ---------- results ---------- */
  #results{padding:0 0 60px}
  .res-hero{text-align:center;color:#fff;padding:38px 24px 30px}
  .res-hero h1{font-size:32px;font-weight:800;margin-bottom:12px;text-wrap:balance}
  .res-hero p{color:#aab6d6;font-size:16px;max-width:36ch;margin:0 auto}
  .res-body{padding:0 16px}

  .metric{margin-bottom:20px}
  .metric:last-child{margin-bottom:0}
  .metric-label{font-weight:700;font-size:16px;margin-bottom:9px}
  .metric-row{display:flex;align-items:center;gap:14px}
  .bar{flex:1;height:14px;background:var(--blue-soft);border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;width:0;background:var(--blue);border-radius:99px;transition:width 1s cubic-bezier(.2,.7,.3,1)}
  .metric-val{font-weight:800;font-size:19px;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}

  .week{display:grid;grid-template-columns:46px 1fr;gap:0 16px}
  .week-marker{display:flex;flex-direction:column;align-items:center}
  .week-check{
    width:46px;height:46px;border-radius:50%;background:var(--blue-soft);color:#fff;
    display:grid;place-items:center;flex:none;
  }
  .week:last-child .week-check{background:var(--blue)}
  .week-check svg{width:20px;height:20px}
  .week-line{width:2px;flex:1;background:var(--line);margin:6px 0;min-height:22px}
  .week:last-child .week-line{display:none}
  .week-title{font-size:18px;font-weight:800;padding-top:9px}
  .week-text{color:var(--muted);font-size:15px;padding:4px 0 20px}
  .week:last-child .week-text{padding-bottom:0}

  .fact-card{display:flex;flex-direction:column;gap:14px}
  .fact-label{font-size:14px;font-weight:700;color:var(--muted)}
  .fact-row{display:flex;align-items:center;gap:16px}
  .fact-ico{
    width:54px;height:54px;border-radius:14px;background:#f2f4f9;
    display:grid;place-items:center;font-size:26px;flex:none;
  }
  .fact-val{font-size:21px;font-weight:800}

  .cta-wrap{margin:26px 0}
  .checkout-note{
    text-align:center;color:#fff;font-weight:700;font-size:15px;margin:26px 0 14px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .paychips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
  .paychip{
    background:#fff;border-radius:10px;padding:9px 16px;
    font-weight:800;font-size:14px;color:#33415c;letter-spacing:.02em;
  }

  .plans{display:flex;flex-direction:column;gap:12px}
  .plan{
    position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
    border:2px solid var(--line);border-radius:18px;background:#fff;padding:18px;
    transition:border-color .12s ease;
  }
  .plan.selected{border-color:var(--blue);background:var(--blue-faint)}
  .plan-radio{
    width:22px;height:22px;border-radius:50%;border:2px solid #c3cadb;flex:none;
    display:grid;place-items:center;
  }
  .plan.selected .plan-radio{border-color:var(--blue)}
  .plan.selected .plan-radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--blue)}
  .plan-name{font-weight:800;font-size:16.5px}
  .plan-sub{color:var(--muted);font-size:13.5px;text-decoration:line-through}
  .plan-price{margin-left:auto;text-align:right}
  .plan-day{font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
  .plan-per{color:var(--muted);font-size:12.5px}
  .plan-tag{
    position:absolute;top:-11px;left:18px;background:var(--blue);color:#fff;
    font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 12px;border-radius:999px;
  }

  .inc-list{list-style:none;display:flex;flex-direction:column;gap:16px}
  .inc-list li{display:flex;gap:14px;align-items:flex-start;font-size:16px;font-weight:600}
  .inc-check{
    width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;
    display:grid;place-items:center;flex:none;margin-top:-2px;
  }
  .inc-check svg{width:14px;height:14px}

  .guarantee{background:#f2f4f9;text-align:center}
  .g-badge{
    width:120px;height:120px;border-radius:50%;background:var(--navy);color:#fff;
    margin:6px auto 22px;display:grid;place-items:center;
    outline:3px solid var(--navy);outline-offset:6px;
  }
  .g-badge svg{width:34px;height:34px;margin-bottom:6px}
  .g-badge-inner{display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:13px;line-height:1.3}
  .guarantee h2{margin-bottom:10px}
  .guarantee p{color:var(--muted);font-size:15.5px;max-width:36ch;margin:0 auto}

  .research{text-align:center;color:#fff;padding:44px 24px 8px}
  .research h2{font-size:27px;font-weight:800;margin-bottom:12px;text-wrap:balance}
  .research p{color:#aab6d6;font-size:15.5px;max-width:40ch;margin:0 auto}
  .retake{
    margin:34px auto 0;display:block;background:none;border:0;color:#8fa0c9;
    font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline;
  }
  .retake:hover{color:#fff}
  .demo-note{text-align:center;color:#5c6d99;font-size:12px;padding:26px 24px 34px}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:#fff;color:var(--ink);font-weight:600;font-size:14.5px;
    padding:13px 22px;border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.35);
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
    max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){
    .bar-fill,.quiz-fill{transition:none}
    .ring{animation-duration:2.5s}
  }
  @media (min-width:560px){
    .hero-inner h1{font-size:40px}
  }
</style>
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="brand"><span class="brand-dot">🗣</span><span id="brand-name">LinguaPlan</span></div>
    <button class="lang-btn" id="lang-toggle" type="button">中文</button>
  </header>

  <!-- HERO -->
  <section class="screen active" id="hero">
    <div class="hero-inner">
      <span class="hero-eyebrow" data-i18n="heroEyebrow"></span>
      <h1 id="hero-title"></h1>
      <p class="hero-sub" data-i18n="heroSub"></p>
      <button class="btn" id="start-btn" type="button" data-i18n="heroCta"></button>
      <div class="hero-stats">
        <div><b>5</b><span data-i18n="statWeeks"></span></div>
        <div><b>10<span style="font-size:14px">min</span></b><span data-i18n="statDaily"></span></div>
        <div><b>1<span style="font-size:14px">min</span></b><span data-i18n="statQuiz"></span></div>
      </div>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="quiz">
    <div class="quiz-track"><div class="quiz-fill" id="quiz-fill"></div></div>
    <div class="quiz-step" id="quiz-step"></div>
    <div class="quiz-q" id="quiz-q"></div>
    <div class="opts" id="quiz-opts"></div>
    <button class="quiz-back" id="quiz-back" type="button" data-i18n="back"></button>
  </section>

  <!-- LOADING -->
  <section class="screen" id="loading">
    <div class="ring" aria-hidden="true"></div>
    <h2 data-i18n="loadTitle"></h2>
    <p id="load-step"></p>
  </section>

  <!-- RESULTS -->
  <section class="screen" id="results">
    <div class="res-hero">
      <h1 data-i18n="resTitle"></h1>
      <p data-i18n="resSub"></p>
    </div>

    <div class="res-body">
      <div class="card">
        <h2 data-i18n="noticeTitle"></h2>
        <div id="metrics"></div>
      </div>

      <div class="card">
        <h2 data-i18n="roadmapTitle"></h2>
        <div id="roadmap"></div>
      </div>

      <div class="card fact-card" id="facts"></div>

      <div class="cta-wrap"><button class="btn cta-plan" type="button" data-i18n="getPlan"></button></div>

      <div class="card">
        <h2 data-i18n="choosePlan"></h2>
        <div class="plans" id="plans"></div>
      </div>

      <div class="checkout-note">🔒 <span data-i18n="secureNote"></span></div>
      <div class="paychips">
        <span class="paychip">VISA</span><span class="paychip">Mastercard</span>
        <span class="paychip">PayPal</span><span class="paychip"> Pay</span>
        <span class="paychip">G Pay</span>
      </div>

      <div class="cta-wrap"><button class="btn cta-plan" type="button" data-i18n="getPlan"></button></div>

      <div class="card">
        <h2 data-i18n="incTitle"></h2>
        <ul class="inc-list" id="inc-list"></ul>
      </div>

      <div class="card guarantee">
        <div class="g-badge">
          <div class="g-badge-inner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
            <span data-i18n="gBadge"></span>
          </div>
        </div>
        <h2 data-i18n="gTitle"></h2>
        <p data-i18n="gText"></p>
      </div>
    </div>

    <div class="research">
      <h2 data-i18n="researchTitle"></h2>
      <p data-i18n="researchText"></p>
      <button class="retake" id="retake" type="button" data-i18n="retake"></button>
    </div>

    <p class="demo-note" data-i18n="demoNote"></p>
  </section>

</div>

<div class="toast" id="toast" role="status"></div>

    questions: [
      { q:"你的主要目标是什么？", opts:[["💼","职业发展"],["💬","让日常对话更轻松"],["✈️","自信旅行"],["🎓","通过考试"]] },
      { q:"你目前的英语水平？", opts:[["🌱","初级"],["📗","中级"],["📕","中高级"],["🏆","高级"]] },
      { q:"你最想提升哪个方面？", opts:[["💬","口语"],["🎧","听力"],["🧠","词汇"],["✍️","语法"]] },
      { q:"你每天能练习多长时间？", opts:[["⏱️","5 分钟"],["⏲️","10 分钟"],["🕐","20 分钟"],["🔥","30+ 分钟"]] },
      { q:"你目前最大的挑战是什么？", opts:[["😳","自信开口说"],["🧩","记住新单词"],["👂","听懂母语者"],["📅","坚持学习"]] }
    ]
  }
};

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';

let lang = "en";
let step = 0;
const answers = [];   // indices per question
let selectedPlan = 1; // default: most popular

const $ = s => document.querySelector(s);
const t = () => I18N[lang];

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo({top:0, behavior:"instant"});
}

function applyStatics(){
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  $("#lang-toggle").textContent = lang === "zh" ? "EN" : "中文";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const v = t()[el.dataset.i18n];
    if (typeof v === "string") el.innerHTML = v;
  });
  $("#hero-title").innerHTML = t().heroTitle;
}

/* ---------- quiz ---------- */
function renderQuiz(){
  const qs = t().questions, q = qs[step];
  $("#quiz-fill").style.width = (step / qs.length * 100) + "%";
  $("#quiz-step").textContent = t().stepOf(step+1, qs.length);
  $("#quiz-q").textContent = q.q;
  $("#quiz-back").style.visibility = step === 0 ? "hidden" : "visible";
  const wrap = $("#quiz-opts");
  wrap.innerHTML = "";
  q.opts.forEach(([ico,label],i)=>{
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt";
    b.innerHTML = `<span class="ico">${ico}</span><span>${label}</span>`;
    b.addEventListener("click", ()=>{
      answers[step] = i;
      if (step < qs.length-1){ step++; renderQuiz(); }
      else runLoading();
    });
    wrap.appendChild(b);
  });
}

/* ---------- loading ---------- */
function runLoading(){
  show("#loading");
  const steps = t().loadSteps;
  let i = 0;
  $("#load-step").textContent = steps[0];
  const iv = setInterval(()=>{
    i++;
    if (i < steps.length){ $("#load-step").textContent = steps[i]; }
    else { clearInterval(iv); renderResults(); show("#results"); }
  }, 1100);
}

/* ---------- results ---------- */
function renderResults(){
  // metrics — small boost to the user's chosen focus area
  const focus = answers[2] ?? 0; // 0 speaking / 1 listening / 2 vocab / 3 grammar
  const mWrap = $("#metrics");
  mWrap.innerHTML = "";
  t().metrics.forEach(([label,base],i)=>{
    let v = base;
    if ((focus === 0 && i === 0) || (focus === 2 && i === 1)) v = Math.min(base+10, 90);
    const div = document.createElement("div");
    div.className = "metric";
    div.innerHTML =
      `<div class="metric-label">${label}</div>
       <div class="metric-row">
         <div class="bar"><div class="bar-fill" data-w="${v}"></div></div>
         <div class="metric-val">+${v}%</div>
       </div>`;
    mWrap.appendChild(div);
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll(".bar-fill").forEach(b=> b.style.width = b.dataset.w + "%");
  }));

  // roadmap
  const rWrap = $("#roadmap");
  rWrap.innerHTML = "";
  t().weeks.forEach(([title,text])=>{
    const w = document.createElement("div");
    w.className = "week";
    w.innerHTML =
      `<div class="week-marker"><div class="week-check">${CHECK}</div><div class="week-line"></div></div>
       <div><div class="week-title">${title}</div><div class="week-text">${text}</div></div>`;
    rWrap.appendChild(w);
  });

  // facts from answers
  const qs = t().questions;
  const pick = qi => qs[qi].opts[answers[qi] ?? 0];
  const facts = [
    [t().factGoal,  pick(0)],
    [t().factLevel, pick(1)],
    [t().factFocus, pick(2)]
  ];
  const fWrap = $("#facts");
  fWrap.innerHTML = "";
  facts.forEach(([label,[ico,val]])=>{
    const d = document.createElement("div");
    d.innerHTML =
      `<div class="fact-label">${label}</div>
       <div class="fact-row"><div class="fact-ico">${ico}</div><div class="fact-val">${val}</div></div>`;
    fWrap.appendChild(d);
  });

  // plans
  const pWrap = $("#plans");
  pWrap.innerHTML = "";
  t().plans.forEach((p,i)=>{
    const [name, was, now, perDay, per, tag] = p;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "plan" + (i === selectedPlan ? " selected" : "");
    b.innerHTML =
      (tag ? `<span class="plan-tag">${tag}</span>` : "") +
      `<span class="plan-radio"></span>
       <span><span class="plan-name">${name}</span><br><span class="plan-sub">${was}</span> <b>${now}</b></span>
       <span class="plan-price"><span class="plan-day">${perDay}</span><br><span class="plan-per">${per}</span></span>`;
    b.addEventListener("click", ()=>{
      selectedPlan = i;
      pWrap.querySelectorAll(".plan").forEach((el,j)=> el.classList.toggle("selected", j === i));
    });
    pWrap.appendChild(b);
  });

  // includes
  const iWrap = $("#inc-list");
  iWrap.innerHTML = "";
  t().incItems.forEach(item=>{
    const li = document.createElement("li");
    li.innerHTML = `<span class="inc-check">${CHECK}</span><span>${item}</span>`;
    iWrap.appendChild(li);
  });
}

/* ---------- wiring ---------- */
$("#start-btn").addEventListener("click", ()=>{ step = 0; show("#quiz"); renderQuiz(); });
$("#quiz-back").addEventListener("click", ()=>{ if (step > 0){ step--; renderQuiz(); } });
$("#retake").addEventListener("click", ()=>{ step = 0; answers.length = 0; show("#quiz"); renderQuiz(); });
$("#lang-toggle").addEventListener("click", ()=>{
  lang = lang === "en" ? "zh" : "en";
  applyStatics();
  if ($("#quiz").classList.contains("active")) renderQuiz();
  if ($("#results").classList.contains("active")) renderResults();
});

let toastTimer;
document.addEventListener("click", e=>{
  if (e.target.closest(".cta-plan")){
    const el = $("#toast");
    el.textContent = t().toast;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el.classList.remove("show"), 3200);
  }
});

applyStatics();
</script>
</body>
</html>
